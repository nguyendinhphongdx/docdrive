services:
  postgres:
    image: postgres:17-alpine
    container_name: docdrive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docdrive
      POSTGRES_PASSWORD: docdrive
      POSTGRES_DB: docdrive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
